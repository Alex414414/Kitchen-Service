{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.5/dist/css/tabler.min.css">
  <link rel="stylesheet" href="{% static 'kitchen/css/style.css' %}">
  <meta charset="UTF-8">
  <title>{% block title %}Kitchen Service{% endblock %}</title>
</head>
<body>
  <div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg">
      <div class="container-fluid">
        <div class="navbar-brand">
          Kitchen Service
        </div>
        {% include "includes/sidebar.html" %}
      </div>
    </aside>
    <div class="page-wrapper">
      <div class="page-body">
        <div class="container-xl">
          {% block content %}
          {% endblock %}
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.7.5/dist/js/tabler.min.js"></script>
</body>
</html>
