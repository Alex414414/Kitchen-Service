<nav>
  <ul>
    <li>
      <a href={% url "kitchen:index" %}>Home</a>
    </li>

      <li>
        <form action="{% url 'logout' %}" method="post">

      </li>
    {% else %}
      <li>
        <a href="{% url 'login' %}">Login</a>
      </li>
    {% endif %}
  </ul>
</nav>
